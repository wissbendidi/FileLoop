<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FileLoop – Chat about your files</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #e4e4e4;
      --text-muted: #888;
      --accent: #667eea;
      --accent-hover: #5a6fd8;
      --user-msg: #2a2a3a;
      --assistant-msg: #1e1e2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .folder-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }
    .folder-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
    }
    .folder-row input::placeholder { color: var(--text-muted); }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: var(--accent);
      color: white;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.secondary:hover { background: var(--border); }
    .status {
      font-size: 13px;
      color: var(--text-muted);
    }
    .status.ready { color: #6ee7b7; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      margin-bottom: 20px;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { background: var(--user-msg); }
    .msg.assistant { background: var(--assistant-msg); border: 1px solid var(--border); }
    .msg .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 6px; }
    .msg .snippet {
      font-size: 13px;
      margin-top: 10px;
      padding: 10px;
      background: var(--bg);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }
    .msg .snippet + .snippet { margin-top: 8px; }
    .msg .snippet .path { color: var(--text-muted); font-size: 12px; margin-bottom: 4px; }
    .input-area {
      padding: 16px 20px 24px;
      border-top: 1px solid var(--border);
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .input-wrap {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-wrap textarea {
      flex: 1;
      min-height: 52px;
      max-height: 200px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
    }
    .input-wrap textarea::placeholder { color: var(--text-muted); }
    .input-wrap textarea:focus { outline: none; border-color: var(--accent); }
    .options {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-panel h3 { margin: 0; padding: 16px; border-bottom: 1px solid var(--border); }
    .modal-panel .list { overflow-y: auto; padding: 8px; }
    .modal-panel .entry {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-panel .entry:hover { background: var(--border); }
    .modal-panel .entry.dir { font-weight: 500; }
    .modal-panel .breadcrumb { padding: 8px 12px; font-size: 12px; color: var(--text-muted); }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="header">
    <h1>FileLoop</h1>
    <div class="folder-row">
      <input type="text" id="folderPath" placeholder="Enter folder path or browse…" />
      <button type="button" class="btn secondary" id="btnBrowse">Browse</button>
      <button type="button" class="btn" id="btnIndex">Build index</button>
    </div>
    <span class="status" id="status">No folder indexed</span>
  </header>

  <main class="messages" id="messages"></main>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="userInput" placeholder="Ask something about your files…" rows="1"></textarea>
      <button type="button" class="btn" id="btnSend">Send</button>
    </div>
    <div class="options">
      <label><input type="checkbox" id="useOllama" /> Use Ollama for answers</label>
      <span id="ollamaStatus"></span>
    </div>
  </div>

  <div class="modal" id="browseModal">
    <div class="modal-panel">
      <h3>Choose folder — click a folder to open it</h3>
      <div class="breadcrumb" id="browseBreadcrumb"></div>
      <div class="list" id="browseList"></div>
      <div style="padding: 12px; border-top: 1px solid var(--border);">
        <button type="button" class="btn" id="btnUseFolder">Use this folder</button>
      </div>
    </div>
  </div>

  <script>
    const folderPathEl = document.getElementById('folderPath');
    const btnBrowse = document.getElementById('btnBrowse');
    const btnIndex = document.getElementById('btnIndex');
    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    const userInputEl = document.getElementById('userInput');
    const btnSend = document.getElementById('btnSend');
    const useOllamaEl = document.getElementById('useOllama');
    const ollamaStatusEl = document.getElementById('ollamaStatus');
    const browseModal = document.getElementById('browseModal');
    const browseBreadcrumb = document.getElementById('browseBreadcrumb');
    const browseList = document.getElementById('browseList');

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json', ...options.headers },
        ...options,
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || res.statusText);
      }
      return res.json();
    }

    async function refreshStatus() {
      try {
        const s = await api('/api/status');
        if (s.ready) {
          statusEl.textContent = `Indexed ${s.chunk_count} chunks from ${s.indexed_path}`;
          statusEl.classList.add('ready');
        } else {
          statusEl.textContent = 'No folder indexed';
          statusEl.classList.remove('ready');
        }
      } catch {
        statusEl.textContent = 'No folder indexed';
        statusEl.classList.remove('ready');
      }
    }

    async function buildIndex() {
      const path = folderPathEl.value.trim();
      if (!path) {
        statusEl.textContent = 'Enter a folder path first';
        return;
      }
      btnIndex.disabled = true;
      statusEl.innerHTML = '<span class="spinner"></span> Building index…';
      try {
        const r = await api('/api/index', {
          method: 'POST',
          body: JSON.stringify({ folder_path: path }),
        });
        statusEl.textContent = `Indexed ${r.chunk_count} chunks`;
        statusEl.classList.add('ready');
      } catch (e) {
        statusEl.textContent = 'Error: ' + e.message;
      }
      btnIndex.disabled = false;
    }

    function addMessage(role, content, hits = null, answer = null) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (role === 'user') {
        div.textContent = content;
      } else {
        if (answer) {
          div.innerHTML = `<div class="label">Answer</div><div>${escapeHtml(answer)}</div>`;
        }
        if (hits && hits.length) {
          const snips = hits.map(h => `
            <div class="snippet">
              <div class="path">${escapeHtml(h.path)} · score ${h.score}</div>
              <div>${escapeHtml(h.text.slice(0, 800))}${h.text.length > 800 ? '…' : ''}</div>
            </div>
          `).join('');
          div.innerHTML = (div.innerHTML || '') + `<div class="label">Snippets</div>${snips}`;
        }
        if (!answer && (!hits || !hits.length)) div.textContent = 'No relevant snippets found.';
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    async function sendMessage() {
      const text = userInputEl.value.trim();
      if (!text) return;
      addMessage('user', text);
      userInputEl.value = '';
      btnSend.disabled = true;
      try {
        const r = await api('/api/chat', {
          method: 'POST',
          body: JSON.stringify({
            message: text,
            use_ollama: useOllamaEl.checked,
            ollama_model: useOllamaEl.checked ? undefined : null,
            ollama_base_url: 'http://localhost:11434',
          }),
        });
        addMessage('assistant', null, r.hits, r.answer);
      } catch (e) {
        addMessage('assistant', 'Error: ' + e.message);
      }
      btnSend.disabled = false;
    }

    let currentBrowsePath = '';
    async function loadBrowseDir(path) {
      const q = path ? `?path=${encodeURIComponent(path)}` : '';
      const r = await api('/api/list_dir' + q);
      currentBrowsePath = r.path;
      browseBreadcrumb.textContent = r.path;
      const dirs = r.entries.filter(e => e.is_dir);
      browseList.innerHTML = dirs
        .map(e => `<div class="entry dir" data-path="${escapeHtml(e.path)}">📁 ${escapeHtml(e.name)}</div>`)
        .join('');
      browseList.querySelectorAll('.entry').forEach(el => {
        el.addEventListener('click', () => loadBrowseDir(el.dataset.path));
      });
    }
    function useCurrentFolder() {
      folderPathEl.value = currentBrowsePath;
      browseModal.classList.remove('open');
    }

    btnIndex.addEventListener('click', buildIndex);
    btnSend.addEventListener('click', sendMessage);
    userInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById('btnUseFolder').addEventListener('click', useCurrentFolder);
    btnBrowse.addEventListener('click', async () => {
      browseModal.classList.add('open');
      await loadBrowseDir(folderPathEl.value.trim() || undefined);
    });
    browseModal.addEventListener('click', (e) => {
      if (e.target === browseModal) browseModal.classList.remove('open');
    });

    async function checkOllama() {
      try {
        const r = await api('/api/ollama');
        ollamaStatusEl.textContent = r.available ? `Ollama (${r.models.length} models)` : 'Ollama not detected';
      } catch {
        ollamaStatusEl.textContent = '';
      }
    }

    refreshStatus();
    checkOllama();
  </script>
</body>
</html>
